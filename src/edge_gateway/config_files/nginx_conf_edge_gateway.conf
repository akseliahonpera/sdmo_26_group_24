#################################################################
##  Functional config, other is documentation for the project####
#################################################################

events {
    worker_connections 2048;
}


http {
    upstream backend_api {
        server group26:8443;# change to real one 
    }

    upstream iot_device {
        server 127.0.0.1:80;   # device's local listener,change to real one
    }

    # Device -> nginx -> Server (existing)
    server {
        listen 80;
        server_name edge_gateway;

        location /api/ {
            proxy_pass https://backend_api;   # change to real one 
            proxy_ssl_protocols TLSv1.3;
            proxy_ssl_ciphers HIGH:!aNULL:!MD5;

            # Verify the backend's cert (recommended even in a study setup)
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt; # change to real one 
            proxy_ssl_server_name on;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # Server -> nginx -> Device (new)
    server {
        listen 8443 ssl;            # nginx now terminates TLS on this side
        server_name edge_gateway;

        ssl_certificate     /etc/nginx/certs/edge_gateway.crt;	# change to real one 
        ssl_certificate_key /etc/nginx/certs/edge_gateway.key;	# change to real one 
        ssl_protocols TLSv1.3;      

        location /device/ {
            proxy_pass http://iot_device;   # plain http to the device
            proxy_set_header Host $host;
        }
    }
	server {#non tls backup
        listen 7777;            # port 7777 for bare http
        server_name edge_gateway;
        location /device/ {
            proxy_pass http://iot_device;   # plain http to the device
            proxy_set_header Host $host;
        }
    }
}